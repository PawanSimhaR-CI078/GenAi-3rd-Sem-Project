{% extends "user/base_user.html" %}
{% block title %}Create Story{% endblock %}
{% block content %}
<div class="bg-white p-6 rounded shadow max-w-2xl">
  <h2 class="text-2xl font-bold mb-4">Create Story</h2>
  <form id="form">
    <label class="block mb-1">Title</label>
    <input name="title" class="w-full border p-2 mb-3 rounded" required>
    <label class="block mb-1">Story Content / Idea</label>
    <textarea name="content" rows="6" class="w-full border p-2 mb-3 rounded" required></textarea>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block mb-1">Character Gender</label>
        <select name="character_gender" class="w-full border p-2 mb-3 rounded"><option value="">unspecified</option><option>male</option><option>female</option><option>non-binary</option></select></div>
      <div><label class="block mb-1">Target Audience</label>
        <input name="target_audience" class="w-full border p-2 mb-3 rounded"></div>
      <div><label class="block mb-1">Desired Length</label>
        <select name="desired_length" class="w-full border p-2 mb-3 rounded"><option>short</option><option selected>medium</option><option>long</option></select></div>
      <div><label class="block mb-1">Language</label>
        <input name="language" value="English" class="w-full border p-2 mb-3 rounded"></div>
    </div>
    <button class="bg-blue-600 text-white px-4 py-2 rounded">Create</button>
  </form>
  <div id="msg" class="mt-2"></div>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const body=Object.fromEntries(fd.entries());
  const r=await fetch('/api/v1/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
  const j=await r.json();
  if(j.success){ location.href='/stories/'+j.data.story_id; } else { document.getElementById('msg').textContent=j.message; document.getElementById('msg').className='mt-2 text-red-600'; }
});
</script>
{% endblock %}
