{% extends "user/base_user.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="bg-white p-6 rounded shadow max-w-md">
  <h2 class="text-2xl font-bold mb-4">Profile</h2>
  <div id="info">Loading...</div>
</div>
<script>
async function load(){ const r=await fetch('/api/v1/auth/me',{credentials:'same-origin'}); const j=await r.json(); if(j.success){ const d=j.data; document.getElementById('info').innerHTML=`<p><b>Username:</b> ${d.username}</p><p><b>Role:</b> ${d.role}</p><p><b>Tokens:</b> ${d.token_balance}</p>`; } }
load();
</script>
{% endblock %}
