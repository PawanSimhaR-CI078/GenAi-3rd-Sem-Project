{% extends "user/base_user.html" %}
{% block title %}Story Editor{% endblock %}
{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h2 id="title" class="text-2xl font-bold mb-2">Loading...</h2>
  <div class="mb-3 text-sm text-gray-500">Status: <span id="status"></span></div>
  <div class="mb-4">
    <button id="genBtn" class="bg-green-600 text-white px-4 py-2 rounded mr-2">Generate Script</button>
    <button id="regenBtn" class="bg-yellow-600 text-white px-4 py-2 rounded mr-2">Regenerate</button>
    <button id="completeBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Mark Completed</button>
  </div>
  <div id="script" class="bg-gray-50 p-4 rounded whitespace-pre-wrap font-mono text-sm">No script yet.</div>
  <div id="msg" class="mt-2"></div>
</div>
<script>
const sid={{ story_id }};
async function load(){
  const r=await fetch('/api/v1/stories/'+sid,{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success){ document.getElementById('msg').textContent=j.message; return; }
  const s=j.data.story;
  document.getElementById('title').textContent=s.title;
  document.getElementById('status').textContent=s.story_status;
  if(s.generated_script){
    try { document.getElementById('script').textContent=JSON.stringify(JSON.parse(s.generated_script),null,2); }
    catch(e){ document.getElementById('script').textContent=s.generated_script; }
  }
}
async function gen(regen){
  const btn=regen?document.getElementById('regenBtn'):document.getElementById('genBtn');
  btn.disabled=true; btn.textContent='Working...';
  const r=await fetch('/api/v1/stories/'+sid+'/'+(regen?'regenerate':'generate'),{method:'POST',credentials:'same-origin'});
  const j=await r.json();
  btn.disabled=false; btn.textContent=regen?'Regenerate':'Generate Script';
  if(j.success){ load(); document.getElementById('msg').textContent='Done'; document.getElementById('msg').className='mt-2 text-green-600'; }
  else { document.getElementById('msg').textContent=j.message; document.getElementById('msg').className='mt-2 text-red-600'; }
}
document.getElementById('genBtn').addEventListener('click',()=>gen(false));
document.getElementById('regenBtn').addEventListener('click',()=>gen(true));
document.getElementById('completeBtn').addEventListener('click', async ()=>{
  await fetch('/api/v1/stories/'+sid+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_status:'COMPLETED'}),credentials:'same-origin'});
  load();
});
load();
</script>
{% endblock %}
