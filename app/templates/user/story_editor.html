{% extends "user/base_user.html" %}
{% block title %}Story Editor — TOLSTOY{% endblock %}
{% block content %}
<div class="mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
  <div>
    <h1 id="title" class="mb-1">Loading...</h1>
    <p class="text-secondary text-sm">Status: <span id="status" class="badge badge-muted">-</span></p>
  </div>
  <div class="flex gap-2">
    <button id="genBtn" class="btn btn-primary">Generate script</button>
    <button id="regenBtn" class="btn btn-secondary">Regenerate</button>
    <button id="completeBtn" class="btn btn-secondary">Mark completed</button>
  </div>
</div>

<div class="card">
  <h2 class="card-title mb-3">Generated script</h2>
  <pre id="script" class="mono text-sm bg-[var(--color-bg)] p-4 rounded-lg overflow-auto" style="max-height:60vh;">No script yet.</pre>
</div>
<div id="msg" class="mt-2"></div>
<script>
const sid={{ story_id }};
async function load(){
  const r=await fetch('/api/v1/stories/'+sid,{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success){ document.getElementById('msg').textContent=j.message; document.getElementById('msg').className='form-error'; return; }
  const s=j.data.story;
  document.getElementById('title').textContent=s.title;
  const st=document.getElementById('status'); st.textContent=s.story_status; st.className='badge '+(s.story_status==='COMPLETED'?'badge-success':'badge-warning');
  if(s.generated_script){
    try { document.getElementById('script').textContent=JSON.stringify(JSON.parse(s.generated_script),null,2); }
    catch(e){ document.getElementById('script').textContent=s.generated_script; }
  } else { document.getElementById('script').textContent='No script yet.'; }
}
async function gen(regen){
  const btn=regen?document.getElementById('regenBtn'):document.getElementById('genBtn');
  btn.disabled=true; const orig=btn.textContent; btn.textContent='Working...';
  const r=await fetch('/api/v1/stories/'+sid+'/'+(regen?'regenerate':'generate'),{method:'POST',credentials:'same-origin'});
  const j=await r.json();
  btn.disabled=false; btn.textContent=orig;
  if(j.success){ showToast('Done','success'); load(); }
  else { showToast(j.message,'error'); document.getElementById('msg').textContent=j.message; document.getElementById('msg').className='form-error'; }
}
document.getElementById('genBtn').addEventListener('click',()=>gen(false));
document.getElementById('regenBtn').addEventListener('click',()=>gen(true));
document.getElementById('completeBtn').addEventListener('click', async ()=>{
  await fetch('/api/v1/stories/'+sid+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_status:'COMPLETED'}),credentials:'same-origin'});
  showToast('Marked completed','success'); load();
});
load();
</script>
{% endblock %}
