{% extends "user/base_user.html" %}
{% block title %}Dashboard — TOLSTOY{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="mb-1">Dashboard</h1>
  <p class="text-secondary">Your creative workspace.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
  <div class="stat-card">
    <div class="stat-label">Available tokens</div>
    <div class="stat-value" id="tokenStat">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total stories</div>
    <div class="stat-value" id="totalStories">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Editing</div>
    <div class="stat-value" id="editingCount">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Completed</div>
    <div class="stat-value" id="completedCount">-</div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h2 class="card-title">Recent stories</h2>
    <a href="/stories/new" class="btn btn-primary btn-sm">Create story</a>
  </div>
  <div id="recentStories"><div class="skeleton" style="height:60px;"></div></div>
</div>
<script>
async function load(){
  const r=await fetch('/api/v1/stories',{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success) return;
  const stories=j.data.stories;
  document.getElementById('totalStories').textContent=stories.length;
  document.getElementById('editingCount').textContent=stories.filter(s=>s.story_status==='EDITING').length;
  document.getElementById('completedCount').textContent=stories.filter(s=>s.story_status==='COMPLETED').length;
  const me=await fetch('/api/v1/auth/me',{credentials:'same-origin'}).then(x=>x.json());
  if(me.success) document.getElementById('tokenStat').textContent=me.data.token_balance;
  const el=document.getElementById('recentStories');
  if(!stories.length){ el.innerHTML='<div class="empty-state"><h3>No stories yet</h3><p>Create your first comic script to get started.</p><a href="/stories/new" class="btn btn-primary mt-3">Create story</a></div>'; return; }
  el.innerHTML=stories.slice(0,6).map(s=>`
    <a href="/stories/${s.id}" class="flex justify-between items-center py-3 border-b border-[var(--color-border)] hover:bg-[var(--color-bg)] px-2 rounded transition">
      <div>
        <div class="font-medium">${esc(s.title)}</div>
        <div class="text-sm text-secondary">${esc((s.content||'').slice(0,80))}</div>
      </div>
      <span class="badge ${s.story_status==='COMPLETED'?'badge-success':'badge-warning'}">${esc(s.story_status)}</span>
    </a>`).join('');
}
load();
</script>
{% endblock %}
