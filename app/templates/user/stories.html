{% extends "user/base_user.html" %}
{% block title %}My Stories - TOLSTOY{% endblock %}
{% block content %}
<div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
  <div>
    <h1 class="mb-1">My Stories</h1>
    <p class="text-secondary">Manage your comic scripts.</p>
  </div>
  <div class="flex gap-2">
    <a href="/stories?status=EDITING" class="btn btn-secondary btn-sm">Editing</a>
    <a href="/stories?status=COMPLETED" class="btn btn-secondary btn-sm">Completed</a>
    <a href="/stories" class="btn btn-secondary btn-sm">All</a>
    <a href="/stories/new" class="btn btn-primary btn-sm">New story</a>
  </div>
</div>
<div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="skeleton" style="height:120px;"></div></div>
<script>
async function load(){
  const params=new URLSearchParams(location.search);
  const status=params.get('status');
  const url='/api/v1/stories'+(status?('?status='+status):'');
  const r=await fetch(url,{credentials:'same-origin'});
  const j=await r.json();
  const el=document.getElementById('list');
  if(!j.success){ el.textContent=j.message; return; }
  const stories=j.data.stories;
  if(!stories.length){ el.innerHTML='<div class="empty-state" style="grid-column:1/-1;"><h3>No stories here</h3><p>Create a new story to get started.</p><a href="/stories/new" class="btn btn-primary mt-3">Create story</a></div>'; return; }
  el.innerHTML=stories.map(s=>`
    <div class="card">
      <div class="flex justify-between items-start mb-2">
        <h3 class="card-title">${esc(s.title)}</h3>
        <span class="badge ${s.story_status==='COMPLETED'?'badge-success':'badge-warning'}">${esc(s.story_status)}</span>
      </div>
      <p class="text-sm text-secondary mb-3">${esc((s.content||'').slice(0,140))}</p>
      <div class="flex gap-2">
        <a href="/stories/${s.id}" class="btn btn-secondary btn-sm">Open</a>
        <span class="text-xs text-muted self-center">${esc(s.generation_status)}</span>
      </div>
    </div>`).join('');
}
load();
</script>
{% endblock %}
