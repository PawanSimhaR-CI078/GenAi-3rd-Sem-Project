{% extends "user/base_user.html" %}
{% block title %}Contact Admin - TOLSTOY{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="mb-1">Contact administrator</h1>
  <p class="text-secondary">Send a message, token request, or complaint.</p>
</div>
<div class="card max-w-2xl">
  <form id="form" class="space-y-4">
    <div class="form-group">
      <label class="form-label" for="subject">Subject</label>
      <input id="subject" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="message">Message</label>
      <textarea id="message" class="form-textarea" rows="6" required></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn">Send message</button>
  </form>
  <div id="msg" class="mt-2"></div>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Sending...';
  const body={subject:document.getElementById('subject').value,message:document.getElementById('message').value};
  const r=await fetch('/api/v1/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
  const j=await r.json();
  btn.disabled=false; btn.textContent='Send message';
  const m=document.getElementById('msg'); m.textContent=j.message; m.className='mt-2 '+(j.success?'text-[var(--color-success)]':'form-error');
  if(j.success){ document.getElementById('form').reset(); }
});
</script>
{% endblock %}
