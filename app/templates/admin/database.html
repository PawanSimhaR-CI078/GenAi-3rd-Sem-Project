{% extends "admin/base_admin.html" %}
{% block title %}Database{% endblock %}
{% block heading %}Database Viewer{% endblock %}
{% block content %}
<div class="mb-3">
  <select id="tbl" class="border p-2 rounded"><option>tolstoy_users</option><option>tolstoy_stories</option><option>tolstoy_system_settings</option></select>
  <button onclick="load()" class="bg-blue-600 text-white px-3 py-2 rounded">Load</button>
</div>
<div class="bg-white p-4 rounded shadow overflow-auto" id="out">Select a table.</div>
<script>
async function load(){
  const t=document.getElementById('tbl').value;
  const r=await fetch('/api/v1/admin/database/'+t,{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success){ document.getElementById('out').textContent=j.message; return; }
  const rows=j.data.rows;
  if(!rows.length){ document.getElementById('out').textContent='No rows.'; return; }
  const cols=Object.keys(rows[0]);
  document.getElementById('out').innerHTML='<table class="text-xs"><thead><tr>'+cols.map(c=>'<th class="p-1">'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td class="p-1 border">'+(r[c]===null?'':String(r[c]).slice(0,60))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}
</script>
{% endblock %}
