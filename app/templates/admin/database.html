{% extends "admin/base_admin.html" %}
{% block title %}Database — Admin{% endblock %}
{% block heading %}Database Viewer{% endblock %}
{% block content %}
<div class="card mb-4">
  <div class="flex gap-2 items-center">
    <select id="tbl" class="form-select" style="max-width:260px;">
      <option>tolstoy_users</option><option>tolstoy_stories</option><option>tolstoy_system_settings</option>
    </select>
    <button onclick="load()" class="btn btn-primary btn-sm">Load</button>
  </div>
</div>
<div class="card">
  <div id="out" class="text-sm text-secondary">Select a table and click Load.</div>
</div>
<script>
async function load(){
  const t=document.getElementById('tbl').value;
  const r=await fetch('/api/v1/admin/database/'+t,{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success){ document.getElementById('out').textContent=j.message; return; }
  const rows=j.data.rows;
  if(!rows.length){ document.getElementById('out').textContent='No rows.'; return; }
  const cols=Object.keys(rows[0]);
  document.getElementById('out').innerHTML='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td class="mono text-xs">'+(r[c]===null?'':String(r[c]).slice(0,80))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
</script>
{% endblock %}
