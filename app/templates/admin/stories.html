{% extends "admin/base_admin.html" %}
{% block title %}Stories — Admin{% endblock %}
{% block heading %}Story Management{% endblock %}
{% block content %}
<div class="card">
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>User</th><th>Title</th><th>Status</th><th>Generation</th><th>Tokens</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
async function load(){
  const r=await fetch('/api/v1/admin/stories',{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success) return;
  document.getElementById('tbody').innerHTML=j.data.stories.map(s=>`
    <tr>
      <td>${esc(s.id)}</td><td>${esc(s.user_id)}</td><td>${esc(s.title)}</td>
      <td><span class="badge ${s.story_status==='COMPLETED'?'badge-success':'badge-warning'}">${esc(s.story_status)}</span></td>
      <td><span class="badge badge-muted">${esc(s.generation_status)}</span></td>
      <td>${esc(s.tokens_consumed)}</td>
    </tr>`).join('');
}
load();
</script>
{% endblock %}
