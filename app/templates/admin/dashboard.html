{% extends "admin/base_admin.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block heading %}Analytics Dashboard{% endblock %}
{% block content %}
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="cards"></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div class="card"><h3 class="card-title mb-3">Users by status</h3><canvas id="c1"></canvas></div>
  <div class="card"><h3 class="card-title mb-3">Stories by status</h3><canvas id="c2"></canvas></div>
  <div class="card"><h3 class="card-title mb-3">Stories per day</h3><canvas id="c3"></canvas></div>
  <div class="card"><h3 class="card-title mb-3">Gemini usage</h3><canvas id="c4"></canvas></div>
</div>
<script>
async function loadSummary(){
  const r=await fetch('/api/v1/admin/analytics/summary',{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success) return;
  const d=j.data;
  const labels={'total_users':'Total users','active_users':'Active users','total_stories':'Total stories','editing_stories':'Editing','completed_stories':'Completed','tokens_consumed':'Tokens consumed','gemini_input_tokens':'Gemini input','gemini_output_tokens':'Gemini output','generation_succeeded':'Generated','generation_failed':'Failed'};
  document.getElementById('cards').innerHTML=Object.entries(d).map(([k,v])=>`<div class="stat-card"><div class="stat-label">${labels[k]||k}</div><div class="stat-value">${v}</div></div>`).join('');
}
async function loadChart(id,key,type){
  const r=await fetch('/api/v1/admin/analytics/charts?chart='+key,{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success) return;
  new Chart(document.getElementById(id),{type:type,data:{labels:j.data.labels,datasets:[{label:key,data:j.data.data,backgroundColor:['#5546E8','#16A36A','#E9A23B','#DC4C4C','#3984E8','#9299AA']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}});
}
loadSummary();
loadChart('c1','users_status','doughnut');
loadChart('c2','stories_status','bar');
loadChart('c3','stories_per_day','line');
loadChart('c4','gemini_usage','bar');
</script>
{% endblock %}
