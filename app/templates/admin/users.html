{% extends "admin/base_admin.html" %}
{% block title %}Users — Admin{% endblock %}
{% block heading %}User Management{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <h2 class="card-title">Users</h2>
    <input id="search" class="form-input" style="max-width:240px;" placeholder="Search username">
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Active</th><th>Tokens</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
async function load(q=''){
  const r=await fetch('/api/v1/admin/users'+(q?'?search='+encodeURIComponent(q):''),{credentials:'same-origin'});
  const j=await r.json();
  if(!j.success) return;
  document.getElementById('tbody').innerHTML=j.data.users.map(u=>`
    <tr>
      <td>${u.id}</td>
      <td>${u.username}</td>
      <td><span class="badge badge-primary">${u.role}</span></td>
      <td>${u.is_active?'<span class="badge badge-success">Active</span>':'<span class="badge badge-error">Inactive</span>'}</td>
      <td>${u.token_balance}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="adjustTokens(${u.id})">Adjust tokens</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleActive(${u.id},${u.is_active})">${u.is_active?'Deactivate':'Activate'}</button>
      </td>
    </tr>`).join('');
}
document.getElementById('search').addEventListener('input', (e)=>load(e.target.value));
async function adjustTokens(id){
  const v=prompt('New token balance:');
  if(v===null) return;
  await fetch('/api/v1/admin/users/'+id+'/tokens',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({token_balance:parseInt(v)}),credentials:'same-origin'});
  load(document.getElementById('search').value);
}
async function toggleActive(id,cur){
  await fetch('/api/v1/admin/users/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:!cur}),credentials:'same-origin'});
  load(document.getElementById('search').value);
}
load();
</script>
{% endblock %}
