{% extends "public/base_public.html" %}
{% block title %}Sign in — TOLSTOY{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">TOLSTOY</div>
    <h1 class="text-2xl font-bold mb-1 text-center">Welcome back</h1>
    <p class="text-sm text-secondary text-center mb-6">Sign in to your account</p>
    <form id="loginForm" class="space-y-4">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="relative">
          <input id="password" name="password" type="password" class="form-input" required autocomplete="current-password">
          <button type="button" class="absolute right-3 top-2.5 text-muted" onclick="togglePw('password',this)">show</button>
        </div>
      </div>
      <button class="btn btn-primary w-full" id="submitBtn">Sign in</button>
    </form>
    <p class="text-sm text-secondary text-center mt-4">No account? <a href="/register">Create one</a></p>
    <div id="msg" class="form-error text-center mt-2"></div>
  </div>
</div>
<script>
function togglePw(id,btn){ const i=document.getElementById(id); i.type=i.type==='password'?'text':'password'; btn.textContent=i.type==='password'?'show':'hide'; }
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Signing in...';
  const body={username:document.getElementById('username').value,password:document.getElementById('password').value};
  const r=await fetch('/api/v1/auth/user/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
  const j=await r.json();
  btn.disabled=false; btn.textContent='Sign in';
  if(j.success){ window.location=(j.data.role==='ADMIN'||j.data.role==='SUPER_ADMIN')?'/admin':'/dashboard'; } else { document.getElementById('msg').textContent=j.message; }
});
</script>
{% endblock %}
