{% extends "public/base_public.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">User Login</h2>
  <form id="loginForm">
    <label class="block mb-2">Username</label>
    <input name="username" class="w-full border p-2 mb-3 rounded" required>
    <label class="block mb-2">Password</label>
    <input name="password" type="password" class="w-full border p-2 mb-3 rounded" required>
    <button class="w-full bg-blue-600 text-white p-2 rounded">Login</button>
  </form>
  <p class="mt-3 text-sm">No account? <a href="/register" class="text-blue-600">Register</a></p>
  <div id="msg" class="mt-2 text-red-600"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const body={username:fd.get('username'),password:fd.get('password')};
  const r=await fetch('/api/v1/auth/user/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
  const j=await r.json();
  if(j.success){ window.location='/dashboard'; } else { document.getElementById('msg').textContent=j.message; }
});
</script>
{% endblock %}
