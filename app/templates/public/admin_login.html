{% extends "public/base_public.html" %}
{% block title %}Admin sign in - TOLSTOY{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">TOLSTOY</div>
    <span class="badge badge-muted mb-3 block text-center">Administrator</span>
    <h1 class="text-2xl font-bold mb-1 text-center">Admin sign in</h1>
    <p class="text-sm text-secondary text-center mb-6">Restricted area</p>
    <form id="adminLoginForm" class="space-y-4">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-input" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-full" id="submitBtn">Sign in</button>
    </form>
    <div id="msg" class="form-error text-center mt-2"></div>
  </div>
</div>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Signing in...';
  const body={username:document.getElementById('username').value,password:document.getElementById('password').value};
  const r=await fetch('/api/v1/auth/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
  const j=await r.json();
  btn.disabled=false; btn.textContent='Sign in';
  if(j.success){ sessionStorage.setItem('tolstoy_tab','1'); window.location='/admin/home'; } else { document.getElementById('msg').textContent=j.message; }
});
</script>
{% endblock %}
