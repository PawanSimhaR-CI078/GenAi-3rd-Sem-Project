<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}TOLSTOY{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<header class="public-nav">
  <a href="/" class="brand">TOLSTOY</a>
  <nav class="flex items-center gap-2">
    <a href="/" class="btn btn-ghost btn-sm">Home</a>
    <a href="/login" class="btn btn-ghost btn-sm">Sign in</a>
    <a href="/register" class="btn btn-primary btn-sm">Get started</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer">© 2026 TOLSTOY — AI Story to Comic Script Generator</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
